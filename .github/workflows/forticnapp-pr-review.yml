name: FortiCNAPP PR Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  security-review:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Install FortiCNAPP CLI
        run: |
          curl -s https://raw.githubusercontent.com/lacework/go-sdk/main/cli/install.sh | bash

      - name: Configure FortiCNAPP
        run: |
          lacework configure \
            -a "${{ secrets.LW_ACCOUNT }}" \
            -k "${{ secrets.LW_API_KEY }}" \
            -s "${{ secrets.LW_API_SECRET }}" \
            --noninteractive

      - name: Install SCA Component
        run: |
          lacework component install sca

      - name: Run Scan
        run: |
          mkdir -p reports

          lacework sca scan ./ \
            -f lw-json \
            -o reports/lacework.json

      - name: Inspect Scan Output
        run: |
          python - <<'EOF'
          import json

          with open("reports/lacework.json") as f:
              report = json.load(f)

          print("=" * 80)
          print("TOP LEVEL KEYS")
          print("=" * 80)
          print(list(report.keys()))

          vulns = report.get("Vulnerabilities", [])

          print()
          print("=" * 80)
          print("NUMBER OF VULNERABILITIES")
          print("=" * 80)
          print(len(vulns))

          if vulns:
              print()
              print("=" * 80)
              print("FIRST VULNERABILITY")
              print("=" * 80)
              print(json.dumps(vulns[0], indent=2))
          else:
              print()
              print("No vulnerabilities found.")
          EOF

      - name: Evaluate Results
        run: |
          python scripts/pr_comment.py

      - name: Publish PR Comment
        if: always()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: reports/pr_comment.md
