name: FortiCNAPP PR Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  security-review:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Install FortiCNAPP CLI
        run: |
          curl -s https://raw.githubusercontent.com/lacework/go-sdk/main/cli/install.sh | bash

      - name: Configure FortiCNAPP
        run: |
          lacework configure \
            -a "${{ secrets.LW_ACCOUNT }}" \
            -k "${{ secrets.LW_API_KEY }}" \
            -s "${{ secrets.LW_API_SECRET }}" \
            --noninteractive

      - name: Install SCA Component
        run: |
          lacework component install sca

      - name: Run Scan
        run: |
          mkdir reports

          lacework sca scan ./ \
            -f lw-json \
            -o reports/lacework.json

      - name: Evaluate Results
        run: |
          python scripts/pr_comment.py

      - name: Publish PR Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: reports/pr_comment.md
