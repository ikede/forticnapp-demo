version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11

    commands:
      - echo "Installing Python dependencies..."
      - python --version
      - pip install --upgrade pip
      - pip install -r requirements.txt

      - echo "Installing FortiCNAPP CLI..."
      - curl -s https://raw.githubusercontent.com/lacework/go-sdk/main/cli/install.sh | bash

      - echo "Checking CLI version..."
      - lacework version

      - echo "Checking authentication..."
      - lacework configure show account

      - echo "Listing available components..."
      - lacework component list

      - echo "Installing SCA component..."
      - lacework component install sca

  build:
    commands:
      - echo "Compiling application..."
      - python -m py_compile app.py

      - echo "Running FortiCNAPP Code Security scan..."
      - lacework sca scan ./ -f lw-json -o /tmp/lacework-scan.json

      - ls -l /tmp/lacework-scan.json

artifacts:
  files:
    - "**/*"
