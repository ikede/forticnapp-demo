version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11

    commands:
      - echo "========================================"
      - echo "Installing Python dependencies..."
      - echo "========================================"

      - python --version
      - pip install --upgrade pip
      - pip install -r requirements.txt

      - echo "========================================"
      - echo "Installing FortiCNAPP CLI..."
      - echo "========================================"

      - curl -s https://raw.githubusercontent.com/lacework/go-sdk/main/cli/install.sh | bash

      - echo "========================================"
      - echo "Configuring FortiCNAPP CLI..."
      - echo "========================================"

      - lacework configure -a "$LW_ACCOUNT" -k "$LW_API_KEY" -s "$LW_API_SECRET" --noninteractive

      - lacework version
      - lacework component install sca

  build:
    commands:
      - echo "========================================"
      - echo "Compiling application..."
      - echo "========================================"

      - python -m py_compile app.py

      - mkdir -p reports

      - echo "========================================"
      - echo "Running FortiCNAPP Code Security Scan..."
      - echo "========================================"

      - lacework sca scan ./ -f lw-json -o reports/lacework.json

      - echo "========================================"
      - echo "Evaluating Security Policy..."
      - echo "========================================"

      - |
        python3 - <<'EOF'
        import json
        import sys

        with open("reports/lacework.json") as f:
            report = json.load(f)

        critical = 0
        high = 0
        medium = 0
        low = 0

        for vuln in report.get("Vulnerabilities", []):
            severity = vuln.get("Info", {}).get("Severity", "").lower()

            if severity == "critical":
                critical += 1
            elif severity == "high":
                high += 1
            elif severity == "medium":
                medium += 1
            elif severity == "low":
                low += 1

        print("")
        print("========================================")
        print(" FortiCNAPP Policy Evaluation")
        print("========================================")
        print(f"Critical : {critical}")
        print(f"High     : {high}")
        print(f"Medium   : {medium}")
        print(f"Low      : {low}")
        print("========================================")

        if critical > 0 or high > 0:
            print("")
            print("❌ BUILD FAILED")
            print("Security policy violated.")
            print("Critical or High vulnerabilities detected.")
            sys.exit(1)

        print("")
        print("✅ BUILD PASSED")
        print("Security policy satisfied.")
        EOF

      - echo "========================================"
      - echo "Generated Reports"
      - echo "========================================"

      - ls -lah reports

artifacts:
  files:
    - reports/**/*
